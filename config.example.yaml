admin_key: CHANGE_ME
idle_seconds: 1800
host: 0.0.0.0
port: 8811
app_prefix: ""
data_dir: data
device: cuda:0
python_bin: python
task_retain_days: 15
upload_expire_hours: 24
preview_bitrate: 2M
# 30=标准/Student  50=高质量/Student  80=超高质量/Teacher
default_steps: 50
# 服务层压内存：长形象只切一段给官方，官方自己正放倒放对齐音频
work_clip_seconds: 12
max_work_width: 1920
max_work_height: 1080
max_preprocess_cache_bytes: 2500000000
# 形象视频时长上限，默认 5 分钟；0 表示不限制
max_video_duration_seconds: 300
# 驱动音频时长上限，默认 5 分钟；0 表示不限制
max_audio_duration_seconds: 300
# 音频超过这个秒数时给引擎加 --cpu-offload（把用完的模型挪到内存，避免解码成片时显存不足；
# 代价是略微变慢）。解码成片所需显存 ≈ 输出帧数 × 3MiB，48G 卡约 90 秒音频就会吃紧。
cpu_offload_above_seconds: 60
# 无 GPU / 无权重时的前端联调：跳过官方 inference.py，按五阶段推进度，
# 用 ffmpeg 把形象视频循环到音频时长并叠驱动音频。有显卡后务必改回 false。
mock_synthesis: false
# 模拟合成墙钟秒数（不含最后导出编码）。超高质量档会再乘 1.5。
mock_duration_seconds: 24
